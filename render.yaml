services:
  - type: web
    name: d2p
    runtime: static
    staticPublishPath: standalone_site
    pullRequestPreviewsEnabled: false
    # Live match data is fetched client-side from data/live_matches.json via
    # raw.githubusercontent.com (kept fresh by a GitHub Actions cron job), so
    # no backend/API service is needed here. See README's "Live Match Data"
    # section. Data-only commits from that Action don't touch standalone_site,
    # so they won't trigger a rebuild of this service.
