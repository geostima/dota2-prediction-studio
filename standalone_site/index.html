<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Prediction Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-left"></div>
  <div class="bg-glow bg-glow-right"></div>
  <div class="embers" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <main class="page">
    <header class="hero">
      <div class="brand-row">
        <img src="dota2-logo.png" alt="Dota 2 logo" class="brand-logo">
        <div>
          <p class="kicker">DOTA 2</p>
          <h1>Prediction Studio</h1>
        </div>
      </div>
      <p class="subtitle">Static website mode. All predictions run in your browser using a trained model snapshot.</p>
      <p class="stamp" id="bundleUpdatedText">Model bundle: loading timestamp...</p>
    </header>

    <section class="panel status-panel">
      <p id="statusText">Loading model bundle...</p>
      <div id="metricsBox" class="metrics-box"></div>
    </section>

    <section class="teams-grid">
      <article class="panel team-panel radiant">
        <h2>Radiant Team</h2>
        <label>Team Name <input id="radiantTeam" placeholder="Enter Radiant team" list="teamSuggestions"></label>
        <button id="radiantAutofillBtn" class="btn btn-ghost btn-small" type="button">Auto Fill Players</button>
        <div class="input-grid" id="radiantRows"></div>
      </article>

      <article class="panel team-panel dire">
        <h2>Dire Team</h2>
        <label>Team Name <input id="direTeam" placeholder="Enter Dire team" list="teamSuggestions"></label>
        <button id="direAutofillBtn" class="btn btn-ghost btn-small" type="button">Auto Fill Players</button>
        <div class="input-grid" id="direRows"></div>
      </article>
    </section>

    <section class="panel action-panel">
      <button id="predictBtn" class="btn btn-primary">Generate Prediction</button>
      <button id="sampleBtn" class="btn btn-ghost">Load Sample Data</button>
    </section>

    <section class="panel results-panel">
      <h2>Prediction Results</h2>
      <div id="resultPlaceholder" class="placeholder">Run a prediction to see output.</div>
      <div id="resultContent" class="hidden"></div>
    </section>
  </main>

  <datalist id="heroSuggestions"></datalist>
  <datalist id="playerSuggestions"></datalist>
  <datalist id="teamSuggestions"></datalist>

  <script src="app.js"></script>
</body>
</html>
