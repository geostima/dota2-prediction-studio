name: Update live match data

# Refreshes data/live_matches.json on a schedule so the static site can fetch
# it from raw.githubusercontent.com with no backend server involved. Secrets
# only ever exist in this Action's environment, never in the browser.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live snapshot
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          CITOAPI_API_KEY: ${{ secrets.CITOAPI_API_KEY }}
        run: python scripts/fetch_live_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_matches.json data/citoapi_state.json data/pandascore_finished_matches.jsonl
          git diff --cached --quiet || git commit -m "chore: refresh live match data"
          git pull --rebase origin main
          git push
